name: Release Bundles

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    name: Package ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal DMG
            os: macos-latest
            linux: false
            rust_targets: aarch64-apple-darwin x86_64-apple-darwin
            args: --target universal-apple-darwin --bundles dmg
            artifact_name: calguard-macos-dmg
            artifact_path: target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - name: Windows NSIS
            os: windows-latest
            linux: false
            rust_targets: ""
            args: --bundles nsis
            artifact_name: calguard-windows-nsis
            artifact_path: target/release/bundle/nsis/*.exe
          - name: Linux deb
            os: ubuntu-22.04
            linux: true
            rust_targets: ""
            args: --bundles deb
            artifact_name: calguard-linux-deb
            artifact_path: target/release/bundle/deb/*.deb

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux Tauri prerequisites
        if: matrix.linux
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Enable pnpm
        run: corepack enable

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Add Rust cross targets
        if: matrix.rust_targets != ''
        run: rustup target add ${{ matrix.rust_targets }}

      - name: Cache Rust artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build desktop bundle
        run: pnpm --filter @calguard/desktop exec tauri build --verbose --ci --no-sign ${{ matrix.args }}

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

  publish-draft:
    name: Publish draft GitHub Release
    needs: package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Create draft release and upload bundles
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" --draft --notes-file docs/RELEASE_NOTES_TEMPLATE.md
          else
            gh release create "$TAG_NAME" \
              --draft \
              --title "CalGuard $TAG_NAME" \
              --notes-file docs/RELEASE_NOTES_TEMPLATE.md
          fi
          while IFS= read -r -d '' artifact; do
            gh release upload "$TAG_NAME" "$artifact" --clobber
          done < <(find release-artifacts -type f -print0)
