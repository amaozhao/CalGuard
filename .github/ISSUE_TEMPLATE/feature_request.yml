name: Feature request
description: Suggest a scoped CalGuard improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the smallest useful version of the feature.
    validations:
      required: true
  - type: checkboxes
    id: boundaries
    attributes:
      label: MVP boundaries
      options:
        - label: This does not require account registration.
        - label: This does not write back to user calendars.
        - label: This can work with static Next.js export inside Tauri.
